# Local development database. Production uses managed Postgres (Supabase/Neon, Canadian region).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinicvoice_owner
      POSTGRES_PASSWORD: owner_dev_password
      POSTGRES_DB: clinicvoice
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicvoice_owner -d clinicvoice"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
